    R('#5a5a50', 0, 18, 64, 3); R('#5a5a50', 0, 43, 64, 3);         // rails
    for (let x = 2; x < 64; x += 8) R('#45453e', x, 21, 2, 22);     // rungs
    const cables = ['#1a3a6a', '#7a6a20', '#6a1c1c', '#1c6a3a', '#1a3a6a', '#505050']; // muted so the racks stay the focus
    cables.forEach((c, i) => R(c, 0, 23 + i * 3, 64, 2));
  }),
  // 3: DNS arena: near-black with a faint purple grid
  makeTex(64, 64, (g, R) => {
    R('#120a1e', 0, 0, 64, 64);
    speckle(R, rng(15), 200, ['#0e0818', '#1a1030']);
    R('#2a1648', 0, 0, 64, 1); R('#2a1648', 0, 0, 1, 64);
    R('#5a2a9a', 0, 0, 1, 1);
  }),
];
const CEIL_TEX = CEIL_SRC.map(c => new Uint32Array(c.getContext('2d').getImageData(0, 0, TEX_SIZE, TEX_SIZE).data.buffer));

// Which ceiling each cell uses: arena, Server Room, closet (plain tiles), else office tiles with a light panel every few cells
const CEIL_MAP = new Uint8Array(MAP_W * MAP_H);
for (let y = 0; y < MAP_H; y++) {
  for (let x = 0; x < MAP_W; x++) {
    const i = y * MAP_W + x, f = FLOOR_MAP[i];
    CEIL_MAP[i] = f === 2 ? 3 : f === 1 ? 2 : f === 3 ? 0 : (x % 4 === 2 && y % 3 === 1) ? 1 : 0;
  }
}

// Floor + ceiling pixels go into one offscreen buffer, then get drawn with drawImage so shake / the death slump still apply
const FLAT_H = SCREEN_H - HALF_H; // rows per half (floor below the horizon, ceiling above)
const flatCanvas = document.createElement('canvas');
flatCanvas.width = SCREEN_W;
flatCanvas.height = SCREEN_H;
const flatCtx = flatCanvas.getContext('2d');
const flatImg = flatCtx.createImageData(SCREEN_W, SCREEN_H);
const flatBuf = new Uint32Array(flatImg.data.buffer);
const floorFog = ctx.createLinearGradient(0, HALF_H, 0, HALF_H + 110); // both darken toward the horizon
floorFog.addColorStop(0, 'rgba(0,0,0,0.7)');
floorFog.addColorStop(1, 'rgba(0,0,0,0)');
const ceilFog = ctx.createLinearGradient(0, HALF_H - 110, 0, HALF_H);
ceilFog.addColorStop(0, 'rgba(0,0,0,0)');
ceilFog.addColorStop(1, 'rgba(0,0,0,0.75)');

// Classic floor casting: each screen row below the horizon is one distance; step across it in world space.
// The ceiling row mirrored above the horizon is the same distance, so one pass fills both.
function drawFloorAndCeiling() {
  const dx0 = player.dirX - player.planeX, dy0 = player.dirY - player.planeY;
  const ddx = 2 * player.planeX / SCREEN_W, ddy = 2 * player.planeY / SCREEN_W;
  for (let y = 0; y < FLAT_H; y++) {
    const rowDist = HALF_H / (y + 0.5);
    const stepX = rowDist * ddx, stepY = rowDist * ddy;
    let fx = player.x + rowDist * dx0, fy = player.y + rowDist * dy0;
    let fi = (HALF_H + y) * SCREEN_W, ci = (HALF_H - 1 - y) * SCREEN_W;
    for (let x = 0; x < SCREEN_W; x++) {
      const cx = Math.floor(fx), cy = Math.floor(fy);
      const cell = cx >= 0 && cy >= 0 && cx < MAP_W && cy < MAP_H ? cy * MAP_W + cx : 0;
      const t = ((fy * TEX_SIZE) & 63) * TEX_SIZE + ((fx * TEX_SIZE) & 63);
      flatBuf[fi++] = FLOOR_TEX[FLOOR_MAP[cell]][t];
      flatBuf[ci++] = CEIL_TEX[CEIL_MAP[cell]][t];
      fx += stepX;
      fy += stepY;
    }
  }
  flatCtx.putImageData(flatImg, 0, 0);
  ctx.drawImage(flatCanvas, 0, 0);
  ctx.fillStyle = floorFog;
  ctx.fillRect(0, HALF_H, SCREEN_W, FLAT_H);
  ctx.fillStyle = ceilFog;
  ctx.fillRect(0, 0, SCREEN_W, HALF_H);
}

// --- Render ---
function render() {
  if (!game.started) { drawTitle(); drawSubtitles(); return; }
  // Screen shake offsets the 3D view and weapon; HUD stays put
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.save();
  if (game.shake) ctx.translate((Math.random() * 2 - 1) * game.shake, (Math.random() * 2 - 1) * game.shake);
  if (game.over) {
    // Death: the view slumps sideways toward the floor
    const t = Math.min(1, (performance.now() - game.overAt) / 900), k = t * t * (3 - 2 * t);
    ctx.translate(SCREEN_W / 2, HALF_H + k * 80);
    ctx.rotate(k * 0.16);
    ctx.translate(-SCREEN_W / 2, -HALF_H);
  }

  // Flat ceiling/floor backdrop (overdrawn past the edges so shake and the death slump never show stale pixels),
  // then the textured floor and ceiling on top
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(-200, -200, SCREEN_W + 400, HALF_H + 200);
  ctx.fillStyle = '#282018';
  ctx.fillRect(-200, HALF_H, SCREEN_W + 400, HALF_H + 200);
  drawFloorAndCeiling();

  // Cast one ray per screen column
  const blink = performance.now() / RACK_BLINK_MS | 0;
  for (let x = 0; x < SCREEN_W; x++) {
    const camX = 2 * x / SCREEN_W - 1;
    const dist = castRay(player.x, player.y,
                         player.dirX + player.planeX * camX,
                         player.dirY + player.planeY * camX);
    zBuf[x] = dist;

    const lineH = Math.floor(SCREEN_H / dist);
    const y0 = Math.max(0, HALF_H - lineH / 2 | 0);
    const y1 = Math.min(SCREEN_H - 1, HALF_H + lineH / 2 | 0);

    // One texture column, stretched to the wall height; side 1 (NS faces) uses the darker copy
    const frames = WALL_TEX[rayHit] || WALL_TEX[1];
    const tex = frames[(blink + rayMapX * 7 + rayMapY * 13) % frames.length][raySide];
    ctx.drawImage(tex, rayWallX * TEX_SIZE | 0, 0, 1, TEX_SIZE, x, HALF_H - lineH / 2, 1, lineH);
    ctx.fillStyle = FOG_STYLES[Math.min(FOG_STEPS, dist * FOG_RATE / FOG_MAX * FOG_STEPS | 0)];
    ctx.fillRect(x, y0, 1, y1 - y0 + 1);
    if (DOOR_TYPES.includes(rayHit)) drawDoorColumn(x, y0, y1, lineH, rayHit);
    else if (rayHit === SWITCH && raySide === 0 && player.dirX + player.planeX * camX < 0) drawSwitchColumn(x, lineH);
  }

  drawSprites();

  // Weapon + HUD + minimap (drawn in order so minimap is on top)
  if (!game.over) drawWeapon();
  drawKeycaps();
  ctx.restore();
  drawScreenFlash();
  if (game.over) {
    drawDeathOverlay();
  } else if (game.won) {
    drawVictoryOverlay();
  } else {
    if (game.boss && game.boss.phase === 3 && game.boss.state !== 'dead') drawGlitch();
    drawCrosshair();
    drawDamageDirs();
    drawHUD();
    drawBossBar();
    if (showMap) drawMinimap();
    if (game.boss && game.boss.state === 'dead') drawServfail();
  }
  drawSubtitles();
}

// Voice-line subtitle, bottom center (above the HUD bar in play)
function drawSubtitles() {
  if (performance.now() >= voice.subUntil) return;
  const y = game.started && !game.over && !game.won ? SCREEN_H - 58 : SCREEN_H - 22;
  ctx.font = 'italic 13px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(voice.sub).width;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(SCREEN_W / 2 - w / 2 - 10, y - 11, w + 20, 22);
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText(voice.sub, SCREEN_W / 2, y);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// Title screen: the art with animated overlays (stages, timings and feature boxes are in the Title screen section)
function drawTitle() {
  const now = performance.now(), cx = SCREEN_W / 2, t = now - title.at;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Loading: black until the art and its effects are ready
  if (title.stage === 'loading') {
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#555';
    ctx.fillText('LOADING…', cx, HALF_H);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    return;
  }

  const intro = title.stage === 'intro' || title.stage === 'ready';
  const landed = intro && t >= SLAM_MS, slamming = intro && !landed, fx = titleArt.fx, [ax, ay] = ART_ANCHOR;
  // With masks only the logo punches in; without them (file://) the whole art does
  const punch = !fx && slamming ? 0.15 * (1 - t / SLAM_MS) : 0;
  const zoom = 1 + 0.04 * (0.5 - 0.5 * Math.cos(now / 20000 * Math.PI)) + punch; // slow push-in and back, 40 s
  const artSpace = () => {
    if (title.shake) ctx.translate((Math.random() * 2 - 1) * title.shake, (Math.random() * 2 - 1) * title.shake);
    ctx.translate(ART_X, 0);
    ctx.scale(ART_SCALE, ART_SCALE);
    ctx.beginPath();
    ctx.rect(0, 0, ART_W, ART_H);
    ctx.clip();
    ctx.translate(ax, ay);
    ctx.scale(zoom, zoom);
    ctx.translate(-ax, -ay);
  };

  ctx.drawImage(titleArt.sides, 0, 0);
  ctx.save();
  artSpace();
  ctx.drawImage(titleArt.img, 0, 0);
  if (fx) drawTitleFx(now, landed ? t : -1); // -1: no logo glint until the slam
  if (fx && slamming) {
    // The logo punches in from oversized and slams into place
    const k = t / SLAM_MS, s = 1 + 0.7 * (1 - k) * (1 - k), [lx, ly, lw, lh] = ART_LOGO;
    ctx.drawImage(titleArt.logo.c, lx + lw / 2 - lw * s / 2, ly + lh / 2 - lh * s / 2, lw * s, lh * s);
  }
  if (landed) {
    // ENTECH, just above the logo
    ctx.globalAlpha = Math.min(1, Math.max(0, (t - SLAM_MS - 300) / 400));
    ctx.font = 'bold 50px monospace';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#000';
    ctx.strokeText('E N T E C H :', ax, 662);
    ctx.fillStyle = '#2aa4ff';
    ctx.fillText('E N T E C H :', ax, 662);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // Fade in from black when the art first appears
  const fade = title.stage === 'art' ? Math.max(0, 1 - t / ART_FADE_MS) : 0;
  if (fade > 0) {
    ctx.fillStyle = `rgba(0,0,0,${fade})`;
    ctx.fillRect(0, 0, SCREEN_W, 470);
  }
  // Impact flash
  if (landed && t < SLAM_MS + 350) {
    ctx.fillStyle = `rgba(255,250,235,${0.85 * (1 - (t - SLAM_MS) / 350)})`;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  }

  // Bottom band: prompt, sound status, credit
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 470, SCREEN_W, SCREEN_H - 470);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 470, SCREEN_W, 1);
  const blink = (now / 450 | 0) % 2 === 0;
  ctx.font = 'bold 15px monospace';
  if (title.stage === 'art' && t >= PROMPT_DELAY_MS && blink) {
    ctx.fillStyle = '#e8e8e8';
    ctx.fillText('PRESS ANY KEY', cx, 486);
  } else if (title.stage === 'ready' && blink) {
    ctx.fillStyle = '#3dff73';
    ctx.fillText('CLICK OR PRESS ANY KEY TO START', cx, 486);
  }
  ctx.font = '10px monospace';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'left';
  ctx.fillText(`sound ${audio.muted ? 'OFF' : 'ON'} [N]`, 10, 486);
  ctx.textAlign = 'right';
  ctx.fillText('SFX: Freedoom (BSD)', SCREEN_W - 10, 486);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// Animated bits over the art (in art-pixel space): humming lights with a dying tube, pulsing red stripe,
// flickering monitors, blinking rack LEDs, and a glint sweeping across the logo
function drawTitleFx(now, t) {
  ctx.globalCompositeOperation = 'lighter';
  titleArt.lights.forEach((L, i) => {
    ctx.globalAlpha = 0.12 + 0.06 * Math.sin(now * 0.05 + i * 1.7);
    ctx.drawImage(L.c, L.x, L.y);
  });
  ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(now * 0.004));
  ctx.drawImage(titleArt.stripeGlow, titleArt.stripe.x, titleArt.stripe.y);
  titleArt.screens.forEach((S, i) => {
    const blip = (now + i * 1300) % 3100 < 90 ? 0.4 : 0;
    ctx.globalAlpha = 0.1 + Math.random() * 0.12 + blip;
    ctx.drawImage(S.c, S.x, S.y);
  });
  // LEDs: every ~0.28 s each one rolls to go dark, flare, or stay as painted
  for (const L of titleArt.leds) {
    const r = (Math.imul((now / 280 + L.seed) | 0, 2654435761) >>> 0) % 100;
    if (r < 22) { ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 0.85; ctx.fillStyle = '#05070a'; }
    else if (r > 80) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.7; ctx.fillStyle = L.color; }
    else continue;
    ctx.fillRect(L.x, L.y, L.w, L.h);
  }
  // Dying tube: a stutter burst every ~5 s, plus the odd random drop-out
  ctx.globalCompositeOperation = 'source-over';
  if ((now % 5200 < 600 && Math.sin(now * 0.9) > 0) || Math.random() < 0.01) {
    const D = titleArt.lightsOff[ART_DYING];
    ctx.globalAlpha = 0.8;
    ctx.drawImage(D.c, D.x, D.y);
  }
  // Glint: a bright diagonal band through the logo's own pixels, every GLINT_EVERY_MS once it's settled
  const gp = (t - INTRO_READY_MS) % GLINT_EVERY_MS;
  if (t > INTRO_READY_MS && gp < GLINT_MS) {
    const G = titleArt.glint, g = G.getContext('2d'), w = G.width, h = G.height, bx = (gp / GLINT_MS) * 1.6 * w - 0.3 * w;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, w, h);
    g.drawImage(titleArt.logoSmall, 0, 0);
    g.globalCompositeOperation = 'source-in';
    const grad = g.createLinearGradient(bx - 45, 0, bx + 45, 30);
    grad.addColorStop(0, 'rgba(255,255,230,0)');
    grad.addColorStop(0.5, 'rgba(255,255,230,0.9)');
    grad.addColorStop(1, 'rgba(255,255,230,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    ctx.drawImage(G, ART_LOGO[0], ART_LOGO[1], ART_LOGO[2], ART_LOGO[3]);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// TTL 0: random dark flickers and horizontal glitch tears
function drawGlitch() {
  if (Math.random() < 0.07) {
    ctx.fillStyle = 'rgba(20,0,40,0.55)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H - 36);
  }
  if (Math.random() < 0.25) {
    for (let i = 0, n = 1 + (Math.random() * 3 | 0); i < n; i++) {
      const y = Math.random() * (SCREEN_H - 60) | 0, h = 4 + (Math.random() * 18 | 0);
      ctx.drawImage(canvas, 0, y, SCREEN_W, h, (Math.random() - 0.5) * 40, y, SCREEN_W, h);
    }
  }
}

// Door detail: dark frame at the edges, two seams, and a lock light (red = locked, green = open).
// Security doors also get a yellow/black hazard band.
function drawDoorColumn(x, y0, y1, lineH, type) {
  if (rayWallX < 0.07 || rayWallX > 0.93) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, y0, 1, y1 - y0 + 1);
    return;
  }
  const seam = Math.max(1, lineH * 0.015);
  ctx.fillStyle = type === DOOR ? '#3a0808' : '#22282e';
  ctx.fillRect(x, HALF_H - lineH * 0.3, 1, seam);
  ctx.fillRect(x, HALF_H + lineH * 0.3, 1, seam);
  if (type === SECURITY_DOOR) {
    ctx.fillStyle = (rayWallX * 8 | 0) % 2 ? '#e0b020' : '#151515';
    ctx.fillRect(x, HALF_H + lineH * 0.34, 1, lineH * 0.1);
  }
  if (rayWallX > 0.42 && rayWallX < 0.58) {
    ctx.fillStyle = doorLocked(type) ? '#ff3030' : '#30ff60';
    ctx.fillRect(x, HALF_H - lineH * 0.05, 1, lineH * 0.1);
  }
}

// Main switch: a steel panel with a status light and a lever (up = off/red, down = on/green)
function drawSwitchColumn(x, lineH) {
  const u = rayWallX;
  if (u < 0.28 || u > 0.72) return;
  const top = HALF_H - lineH * 0.2, h = lineH * 0.4;
  ctx.fillStyle = u < 0.31 || u > 0.69 ? '#111' : '#5a6068'; // panel + dark frame
  ctx.fillRect(x, top, 1, h);
  if (u < 0.31 || u > 0.69) return;
  const on = game.switchOn;
  // Status light (blinks red while off)
  if (u > 0.44 && u < 0.56) {
    ctx.fillStyle = on ? '#30ff60' : (performance.now() / 400 | 0) % 2 ? '#ff3030' : '#601010';
    ctx.fillRect(x, top + h * 0.08, 1, h * 0.12);
  }
  // Lever slot and handle
  if (u > 0.46 && u < 0.54) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, top + h * 0.3, 1, h * 0.6);
  }
  if (u > 0.4 && u < 0.6) {
    ctx.fillStyle = on ? '#30c050' : '#e0b020';
    ctx.fillRect(x, top + h * (on ? 0.72 : 0.3), 1, h * 0.14);
  }
}

function enemyTex(e, now) {
  const set = TEX[e.type];
  if (e.state === 'dead') return set.dead;
  if (e.type === 'dns') {
    if (now < e.stunnedUntil) return set.stun[(now / 90 | 0) % set.stun.length];
    if (now < e.hitUntil) return set.pain;
    if (e.state === 'windup') return set.attack;
    return (now / 400 | 0) % 2 ? set.idle1 : set.idle0;
  }
  if (e.state === 'pain' || now < e.hitUntil) return set.pain;
  if (e.state === 'windup') return set.attack;
  return (e.walkT / 12 | 0) % 2 ? set.walk1 : set.walk0;
}

// Billboard sprites, far → near, clipped per column against the wall z-buffer.
// scale = height as a fraction of wall height; z = bottom edge height above the floor.
function drawSprites() {
  const now = performance.now();
  const list = [];
  for (const e of enemies) list.push({ x: e.x, y: e.y, tex: enemyTex(e, now), scale: e.def.scale, z: e.z || 0 });
  for (const p of projectiles) {
    if (p.kind === 'rocket') { list.push({ x: p.x, y: p.y, tex: TEX.rocket, scale: 0.14, z: 0.3 }); continue; }
    if (p.kind === 'nx')     { list.push({ x: p.x, y: p.y, tex: TEX.nx,     scale: 0.11, z: 0.32 }); continue; }
    // Test page: pulsing red-magenta glow (pushed first, so the page draws on top of it), then the tumbling sheet
    const pulse = 0.7 + 0.3 * Math.sin(now * 0.02 + p.spin);
    const gs = PAGE_GLOW_SCALE * (0.9 + 0.1 * pulse);
    list.push({ x: p.x, y: p.y, tex: TEX.pageGlow, scale: gs, z: PAGE_Z + (PAGE_SCALE - gs) / 2, alpha: pulse, blend: 'lighter' });
    list.push({ x: p.x, y: p.y, tex: TEX.testPage[(now / PAGE_FLIP_MS + p.spin | 0) % TEX.testPage.length], scale: PAGE_SCALE, z: PAGE_Z });
  }
  // Pickups hover gently (~2 s bob), each out of step with the others
  for (const k of pickups) list.push({ x: k.x, y: k.y, tex: PICKUPS[k.kind].tex, scale: PICKUPS[k.kind].scale,
                                     z: 0.05 + 0.035 * (0.5 + 0.5 * Math.sin(now * 0.0032 + k.x * 1.7 + k.y * 2.3)) });
  for (const b of explosions) {
    const t = (now - b.t0) / EXPLOSION_MS;
    const scale = 0.4 + 0.7 * t;
    list.push({ x: b.x, y: b.y, tex: TEX.explosion, scale, z: Math.max(0, 0.35 - scale / 2), alpha: 1 - t });
  }
  for (const f of effects) {
    const t = Math.min(1, (now - f.t0) / f.ms);
    list.push({ x: f.x, y: f.y, tex: f.tex, scale: f.scale * (1 + 0.5 * t), z: f.z + f.rise * t, alpha: 1 - t });
  }
  // Wind-up telegraph: a pulsing glow over any enemy about to attack, brightening as it charges
  for (const e of enemies) {
    if (e.state !== 'windup') continue;
    const p = Math.min(1, 1 - (e.windupUntil - now) / e.def.windupMs);
    const pulse = 0.75 + 0.25 * Math.sin(now * 0.04);
    const scale = e.def.scale * (1.4 + 0.6 * p);
    list.push({ x: e.x, y: e.y, tex: WINDUP_GLOW_TEX[e.type], scale, z: (e.z || 0) + (e.def.scale - scale) / 2,
                alpha: (0.3 + 0.5 * p) * pulse, blend: 'lighter', front: true });
  }
  for (const s of list) s.d = (s.x - player.x) ** 2 + (s.y - player.y) ** 2 - (s.front ? 0.05 : 0);
  list.sort((a, b) => b.d - a.d);

  const invDet = 1 / (player.planeX * player.dirY - player.dirX * player.planeY);
  for (const s of list) {
    const sx = s.x - player.x, sy = s.y - player.y;
    const tx = invDet * (player.dirY * sx - player.dirX * sy);   // screen-space x
    const ty = invDet * (-player.planeY * sx + player.planeX * sy); // depth
    if (ty <= 0.1) continue;

    const screenX = (SCREEN_W / 2) * (1 + tx / ty);
    const fullH   = SCREEN_H / ty;
    const h       = fullH * s.scale;
    const w       = h * s.tex.width / s.tex.height;
    const top     = HALF_H + fullH / 2 - s.z * fullH - h;
    const left    = screenX - w / 2;
    const x0 = Math.max(0, Math.floor(left));
    const x1 = Math.min(SCREEN_W - 1, Math.floor(left + w));
    ctx.globalAlpha = s.alpha ?? 1;
    ctx.globalCompositeOperation = s.blend || 'source-over';
    for (let x = x0; x <= x1; x++) {
      if (ty >= zBuf[x]) continue;
      const texX = Math.min(s.tex.width - 1, Math.floor((x - left) * s.tex.width / w));
      ctx.drawImage(s.tex, texX, 0, 1, s.tex.height, x, top, 1, h);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawWeapon() {
  const a = Math.PI * 2 * performance.now() / BOB_CYCLE_MS;
  ctx.save();
  ctx.translate(Math.cos(a) * BOB_X * weapon.bobAmp, Math.abs(Math.sin(a)) * BOB_Y * weapon.bobAmp);
  if (game.weapon === 'cannon') drawCannon();
  else drawKeyboard();
  ctx.restore();
}

// --- First-person weapons: chunky pixel art ---
// Each weapon is drawn at 1/WPX resolution into a small canvas and blown up with nearest-neighbor, so it gets
// Doom's chunky pixels. The bodies, gloved hands and suit sleeves are built once (shaded, with a dark outline);
// moving parts (keys, rocket, muzzle flash, smoke, RGB glow) go into a scratch canvas each frame, which is then
// tinted by the room you're in (and red when you're hit) before scaling up.
const WPX = 4;
const GLOVE = '#18181b', GLOVE_HI = '#40404a', SLEEVE = '#1c1f26', SLEEVE_HI = '#2c303a', CUFF = '#d6d6d2';

// 1 px dark outline around everything opaque, so the weapon reads as a solid object on any background
function outlineTex(c) {
  const g = c.getContext('2d'), w = c.width, h = c.height, img = g.getImageData(0, 0, w, h), d = img.data, a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (a[y * w + x]) continue;
    if ((x > 0 && a[y * w + x - 1]) || (x < w - 1 && a[y * w + x + 1]) || (y > 0 && a[(y - 1) * w + x]) || (y < h - 1 && a[(y + 1) * w + x])) {
      const i = (y * w + x) * 4;
      d[i] = 10; d[i + 1] = 10; d[i + 2] = 12; d[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

// A metal tube narrowing toward the top, shaded as a cylinder lit from the upper left, written straight into pixels
function shadeTube(img, cx, y0, y1, hwAt, base, rand) {
  const W = img.width, d = img.data;
  for (let y = y0; y < y1; y++) {
    const hw = hwAt(y);
    for (let x = Math.max(0, Math.ceil(cx - hw)); x <= Math.min(W - 1, Math.floor(cx + hw)); x++) {
      const u = (x + 0.5 - cx) / hw, n = Math.sqrt(Math.max(0, 1 - u * u));
      const k = 0.3 + 0.62 * n * (0.8 - 0.3 * u) + 0.5 * Math.exp(-(((u + 0.42) / 0.13) ** 2)) + (rand() - 0.5) * 0.06;
      const i = (y * W + x) * 4;
      d[i] = Math.min(255, base[0] * k); d[i + 1] = Math.min(255, base[1] * k); d[i + 2] = Math.min(255, base[2] * k); d[i + 3] = 255;
    }
  }
}

// Scratch canvas (sized for the bigger weapon) + room tint
const WBUF_W = 104, WBUF_H = 92;
const wbuf = makeTex(WBUF_W, WBUF_H, () => {}), wctx = wbuf.getContext('2d');
const AREA_TINT = [null, [70, 130, 255, 0.16], [160, 70, 255, 0.22], [255, 190, 110, 0.08]]; // by FLOOR_MAP: office, Server Room, arena, IT closet
const wtint = [0, 0, 0, 0];
function blitWeapon(w, h, x, y) {
  const target = AREA_TINT[FLOOR_MAP[Math.floor(player.y) * MAP_W + Math.floor(player.x)]] || [wtint[0], wtint[1], wtint[2], 0];
  for (let i = 0; i < 4; i++) wtint[i] += (target[i] - wtint[i]) * 0.06; // ease between rooms
  wctx.globalCompositeOperation = 'source-atop';
  if (wtint[3] > 0.005) { wctx.fillStyle = `rgba(${wtint[0] | 0},${wtint[1] | 0},${wtint[2] | 0},${wtint[3]})`; wctx.fillRect(0, 0, w, h); }
  if (game.hurt > 0) { wctx.fillStyle = `rgba(255,40,30,${game.hurt * 0.45})`; wctx.fillRect(0, 0, w, h); }
  wctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(wbuf, 0, 0, w, h, x, y, w * WPX, h * WPX);
}
const idleBob = () => weapon.state === 'idle' ? Math.sin(performance.now() * 0.003) * 2 : 0;

// --- Closing Cannon (sprite 72×44; the scratch canvas adds CANNON_TOP rows above it for the muzzle flash) ---
// An original launcher in the style of Doom's: seen from behind, glossy dark gunmetal with a rounded dome at the far
// end and a grey sight knob, three arched ribs, the red "CLOSE W/O EMAIL" band, two arched vent slots, and side
// flanges, the lower pair gripped by the gloved hands. Features arch (∩) like rings around a tube seen from above:
// a pixel's position "along" the body is y + CANNON_ARCH·hw·n, and the bands below are ranges of that.
const CANNON_W = 72, CANNON_H = 44, CANNON_CX = 36, CANNON_TOP = 24;
const CANNON_DOME = [2, 9], CANNON_ARCH = 0.35;   // dome from row 2 (tip) to row 9; arch strength
const cannonHW = y => y < CANNON_DOME[1]
  ? 18 * Math.sqrt(Math.max(0, 1 - ((CANNON_DOME[1] - y) / (CANNON_DOME[1] - CANNON_DOME[0])) ** 2))
  : 18 + 8 * (y - CANNON_DOME[1]) / (CANNON_H - CANNON_DOME[1]);
const CANNON_RIBS  = [[11, 12], [13.5, 14.5], [16, 17]];   // dark grooves (a lit edge follows each)
const CANNON_BAND  = [19.5, 28.5];                          // red label band
const CANNON_VENTS = [[31, 32.5], [35.5, 37]];              // dark slots (|u| < 0.38)
// Row where the top-center of the body reaches a given "along" value (the arch's peak)
const cannonPeak = a => { let y = a; for (let i = 0; i < 4; i++) y = a - CANNON_ARCH * cannonHW(y); return y; };
const CANNON_SPRITE = (() => {
  const c = makeTex(CANNON_W, CANNON_H, () => {}), g = c.getContext('2d'), img = g.createImageData(CANNON_W, CANNON_H), r = rng(21);
  const R = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const inR = (a, ranges) => ranges.some(([p, q]) => a >= p && a < q);
  for (let y = CANNON_DOME[0]; y < CANNON_H; y++) {
    const hw = cannonHW(y);
    if (hw < 0.5) continue;
    for (let x = Math.max(0, Math.ceil(CANNON_CX - hw)); x <= Math.min(CANNON_W - 1, Math.floor(CANNON_CX + hw)); x++) {
      const u = (x + 0.5 - CANNON_CX) / hw, n = Math.sqrt(Math.max(0, 1 - u * u)), along = y + CANNON_ARCH * hw * n;
      // Glossy dark metal: a broad sheen plus a bright streak down the center
      let k = 0.22 + 0.5 * n + 0.65 * Math.exp(-(((u + 0.05) / 0.16) ** 2)) + (r() - 0.5) * 0.05;
      if (y < CANNON_DOME[1]) k *= 0.75 + 0.25 * (y - CANNON_DOME[0]) / (CANNON_DOME[1] - CANNON_DOME[0]); // dome darkens toward its tip
      let base = [74, 76, 82];
      if (inR(along, [CANNON_BAND])) base = [176, 32, 28];
      else if (inR(along, CANNON_RIBS)) k *= 0.35;
      else if (inR(along, CANNON_RIBS.map(([, q]) => [q, q + 0.8]))) k *= 1.35;
      else if (Math.abs(u) < 0.38 && inR(along, CANNON_VENTS)) { base = [12, 12, 14]; k = 1; }
      else if (Math.abs(u) < 0.42 && inR(along, CANNON_VENTS.map(([, q]) => [q, q + 0.7]))) k *= 1.5; // lit lip under each vent
      const i = (y * CANNON_W + x) * 4;
      img.data[i] = Math.min(255, base[0] * k); img.data[i + 1] = Math.min(255, base[1] * k); img.data[i + 2] = Math.min(255, base[2] * k); img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  // Grey sight knob on the dome's tip
  R('#2a2b2e', CANNON_CX - 4, 1, 8, 6); R('#8a8c90', CANNON_CX - 3, 2, 6, 4); R('#c4c6ca', CANNON_CX - 2, 2, 4, 1);
  // Side flanges: a small upper pair and a bigger lower pair (the grips)
  for (const [y0, y1, w] of [[12, 19, 4], [25, 37, 6]]) {
    for (let y = y0; y < y1; y++) {
      const hw = Math.round(cannonHW(y)), shade = y === y0 ? '#6e7076' : y === y1 - 1 ? '#202125' : '#3c3e43';
      R(shade, CANNON_CX - hw - w, y, w + 1, 1);
      R(shade, CANNON_CX + hw, y, w + 1, 1);
    }
  }
  // Gloved hands wrapped around the lower flanges; shirt cuffs and suit sleeves trail off the bottom corners
  for (const flip of [false, true]) {
    const H = (col, x, y, w, h) => R(col, flip ? CANNON_W - x - w : x, y, w, h);
    const ex = Math.round(CANNON_CX - cannonHW(31));
    H(GLOVE, ex - 9, 27, 8, 10);
    for (const fy of [28, 31, 34]) { H(GLOVE_HI, ex - 9, fy, 7, 1); H('#0e0e10', ex - 9, fy + 2, 7, 1); }
    H(CUFF, ex - 10, 37, 9, 2);
    for (let y = 39; y < CANNON_H; y++) H(SLEEVE, ex - 11 - (y - 39), y, 11, 1);
  }
  return outlineTex(c);
})();
// Two muzzle-flash variants (alternate shots), a jagged star in orange → yellow → white
const CANNON_FLASH = [0, 1].map(v => makeTex(44, 36, g => {
  const r = rng(30 + v);
  const star = (rad, col) => {
    g.fillStyle = col;
    g.beginPath();
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2, l = (i % 2 ? 0.45 : 1) * rad * (0.7 + r() * 0.5);
      g.lineTo(22 + Math.cos(a) * l, 18 + Math.sin(a) * l * 0.8);
    }
    g.fill();
  };
  star(20, '#ff6a10'); star(14, '#ffc030'); star(8, '#fff6c0');
}));
const CANNON_TIP_Y = 322; // screen y of the dome's tip at rest

function drawCannon() {
  const now = performance.now(), cx = SCREEN_W / 2, tip = CANNON_TOP + CANNON_DOME[0];
  const top = CANNON_TIP_Y - tip * WPX + weapon.kickY + idleBob(), left = cx - CANNON_W * WPX / 2;
  const tipY = top + tip * WPX;

  if (weapon.flash > 0) { // smooth light bloom behind the pixel flash
    const grad = ctx.createRadialGradient(cx, tipY, 0, cx, tipY, 150);
    grad.addColorStop(0, `rgba(255,150,50,${weapon.flash * 0.75})`);
    grad.addColorStop(1, 'rgba(255,80,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx, tipY, 150, 95, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  wctx.clearRect(0, 0, WBUF_W, WBUF_H);
  wctx.drawImage(CANNON_SPRITE, 0, CANNON_TOP);
  const since = now - weapon.fireAt;                                    // smoke curling up off the tip after a shot
  for (let i = 0; i < 3; i++) {
    const tp = (since - 60 - i * 110) / 900;
    if (tp <= 0 || tp >= 1) continue;
    wctx.fillStyle = `rgba(150,150,150,${0.55 * (1 - tp)})`;
    wctx.beginPath();
    wctx.arc(CANNON_CX + Math.sin(i * 2.1 + tp * 4) * 3, tip - 3 - tp * 18, 2.5 + tp * 5, 0, Math.PI * 2);
    wctx.fill();
  }
  if (weapon.flash > 0) {
    wctx.globalAlpha = weapon.flash;
    wctx.drawImage(CANNON_FLASH[(weapon.fireAt / 7 | 0) % 2], CANNON_CX - 22, tip - 20);
    wctx.globalAlpha = 1;
  }
  blitWeapon(CANNON_W, CANNON_TOP + CANNON_H, left, top);

  // Band label at full resolution so it stays readable, each letter set on the band's arch
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#3a0806';
  ctx.fillStyle = '#fff2dc';
  const [b0, b1] = CANNON_BAND;
  for (const [text, along] of [['CLOSE', b0 + (b1 - b0) * 0.3], ['W/O EMAIL', b0 + (b1 - b0) * 0.74]]) {
    const py = cannonPeak(along), hw = cannonHW(py) * WPX, w = ctx.measureText(text).width;
    let x = cx - w / 2;
    for (const ch of text) {
      const cw = ctx.measureText(ch).width, u = Math.min(0.95, Math.abs(x + cw / 2 - cx) / hw);
      const y = top + (CANNON_TOP + py) * WPX + CANNON_ARCH * hw * (1 - Math.sqrt(1 - u * u));
      ctx.strokeText(ch, x + cw / 2, y);
      ctx.fillText(ch, x + cw / 2, y);
      x += cw;
    }
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// --- Keyboard (96×40): a mechanical keyboard held in both gloved hands, far edge narrower ---
const KB_W = 96, KB_H = 40;
const kbL = y => 14 - 8 * (y - 6) / 29, kbR = y => 82 + 8 * (y - 6) / 29; // case edges (perspective taper)
const KB_ROWS = [[8, 4, 14], [13, 4, 13], [18, 5, 13], [24, 5, 12], [30, 5, 0]]; // [y, height, keys]; 0 = spacebar row
const KEYBOARD_BASE = outlineTex(makeTex(KB_W, KB_H, (g, R) => {
  for (let y = 6; y < 36; y++) {
    const l = Math.round(kbL(y)), r = Math.round(kbR(y));
    R('#1c1d21', l, y, r - l, 1); R('#2c2e33', l, y, 1, 1); R('#2c2e33', r - 1, y, 1, 1);
  }
  R('#3a3c42', Math.round(kbL(6)), 6, Math.round(kbR(6) - kbL(6)), 1);               // far edge highlight
  R('#26272c', 6, 36, 84, 1); R('#111216', 6, 37, 84, 3);                              // front face
  for (const [x, y] of [[47, 5], [46, 4], [45, 3], [43, 2], [41, 2], [39, 1], [37, 1], [35, 0], [33, 0]]) R('#2a2b30', x, y, 2, 1); // cable
}));
const KEYBOARD_HANDS = outlineTex(makeTex(KB_W, KB_H, (g, R) => {
  for (const flip of [false, true]) {
    const H = (col, x, y, w, h) => R(col, flip ? KB_W - x - w : x, y, w, h);
    H('#232328', 2, 14, 9, 16);                                                         // palm on the side
    for (const fy of [15, 19, 23]) { H(GLOVE_HI, 1, fy, 8, 1); H('#121215', 1, fy + 3, 8, 1); } // fingers wrapping underneath
    H('#232328', 8, 16, 8, 4); H(GLOVE_HI, 9, 16, 6, 1); H('#5a5a66', 14, 17, 2, 1);   // thumb over the top, lit tip
    H(CUFF, 1, 30, 10, 2);                                                             // shirt cuff
    H(SLEEVE, 0, 32, 12, 8); H(SLEEVE_HI, 2, 32, 2, 8);                                // suit sleeve
  }
}));

// Keys, drawn each frame: 3D caps (top face + darker front edge); on a blast they press down in a wave from the middle out
function drawKeys(g, pressT) {
  const R = (col, x, y, w, h) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  KB_ROWS.forEach(([y, h, n], ri) => {
    const l = kbL(y + h / 2) + 3, r = kbR(y + h / 2) - 3;
    const units = n ? Array(n).fill(1) : [1, 1, 1, 6, 1, 1, 1];
    const unitW = (r - l - (units.length - 1)) / units.reduce((a, b) => a + b, 0);
    let x = l;
    units.forEach((u, ki) => {
      const x0 = Math.round(x), x1 = Math.round(x + u * unitW), dn = Math.abs((x0 + x1) / 2 - KB_W / 2) / (KB_W / 2);
      const down = pressT >= 0 && Math.abs(dn - pressT) < 0.18;
      const accent = ri === 0 && ki === 0 ? 'esc' : ri === 2 && ki === units.length - 1 ? 'enter' : null;
      const [topC, frontC] = accent === 'esc' ? ['#ff7a45', '#a8401c'] : accent === 'enter' ? ['#2aa4ff', '#16608f'] : ['#4b4d54', '#26272b'];
      if (down) R(frontC, x0, y + 1, x1 - x0, h - 1);
      else {
        R(topC, x0, y, x1 - x0, h - 1);
        R(frontC, x0, y + h - 1, x1 - x0, 1);
        if (!accent && x1 - x0 >= 3) R('#8e9099', x0 + 1, y + 1, 1, 1);                 // legend
      }
      x += u * unitW + 1;
    });
  });
}

function drawKeyboard() {
  const now = performance.now(), cx = SCREEN_W / 2;
  const top = SCREEN_H - 10 - KB_H * WPX + weapon.kickY + idleBob(), left = cx - KB_W * WPX / 2;

  if (weapon.flash > 0) { // muzzle-flash bloom behind the keyboard
    const fy = top + 4 * WPX;
    const grad = ctx.createRadialGradient(cx, fy, 0, cx, fy, 190);
    grad.addColorStop(0,   `rgba(255,255,220,${weapon.flash * 0.95})`);
    grad.addColorStop(0.3, `rgba(255,220,80,${weapon.flash * 0.7})`);
    grad.addColorStop(1,   'rgba(255,160,40,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cx, fy, 190, 120, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  wctx.clearRect(0, 0, WBUF_W, WBUF_H);
  wctx.drawImage(KEYBOARD_BASE, 0, 0);
  const since = now - weapon.fireAt;
  drawKeys(wctx, since < 320 ? since / 260 : -1);
  // RGB underglow leaking around the case: along the far edge and down both sides, hue cycling
  const glow = (x, y, i) => { wctx.fillStyle = `hsl(${(i * 7 + now * 0.08) % 360},90%,55%)`; wctx.fillRect(x, y, 1, 1); };
  for (let x = Math.round(kbL(6)) + 1, i = 0; x < Math.round(kbR(6)) - 1; x++, i++) glow(x, 7, i);
  for (let y = 8; y < 36; y++) { glow(Math.round(kbL(y)) + 1, y, y); glow(Math.round(kbR(y)) - 2, y, 60 - y); }
  wctx.drawImage(KEYBOARD_HANDS, 0, 0);
  blitWeapon(KB_W, KB_H, left, top);
}

// Keycaps thrown by a keyboard blast: fly from the keyboard toward the crosshair, spinning and shrinking
function drawKeycaps() {
  const now = performance.now();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const k of keycaps) {
    const t = Math.min(1, (now - k.t0) / KEYCAP_MS);
    const e = 1 - (1 - t) * (1 - t); // ease out
    const size = 20 * (1 - 0.75 * e);
    ctx.save();
    ctx.translate(k.x0 + (k.x1 - k.x0) * e, k.y0 + (k.y1 - k.y0) * e);
    ctx.rotate(k.rot + k.spin * t);
    ctx.globalAlpha = 1 - t * 0.6;
    ctx.fillStyle = '#4a4a4a';
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.fillStyle = '#5e5e5e';
    ctx.fillRect(-size / 2, -size / 2, size, size * 0.25);
    ctx.fillStyle = '#ddd';
    ctx.font = `bold ${Math.max(6, size * 0.55) | 0}px monospace`;
    ctx.fillText(k.ch, 0, size * 0.05);
    ctx.restore();
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// Small crosshair; flashes into an X hit marker (red on a kill) when pellets connect
function drawCrosshair() {
  const cx = SCREEN_W / 2, cy = HALF_H;
  ctx.fillStyle = 'rgba(120,255,140,0.55)';
  ctx.fillRect(cx - 1, cy - 1, 2, 2);
  ctx.fillRect(cx - 9, cy - 1, 4, 2); ctx.fillRect(cx + 5, cy - 1, 4, 2);
  ctx.fillRect(cx - 1, cy - 9, 2, 4); ctx.fillRect(cx - 1, cy + 5, 2, 4);
  if (game.hitMarker > 0) {
    ctx.strokeStyle = game.killMarker ? `rgba(255,60,60,${game.hitMarker})` : `rgba(255,255,255,${game.hitMarker})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      ctx.moveTo(cx + sx * 6, cy + sy * 6);
      ctx.lineTo(cx + sx * 13, cy + sy * 13);
    }
    ctx.stroke();
  }
}

// Red arcs around the crosshair pointing toward whatever just hurt you (tracks as you turn)
function drawDamageDirs() {
  const now = performance.now();
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  for (const d of damageDirs) {
    const tx = d.x - player.x, ty = d.y - player.y;
    const fwd   = tx * player.dirX + ty * player.dirY;
    const right = tx * -player.dirY + ty * player.dirX;
    if (Math.abs(fwd) + Math.abs(right) < 0.01) continue; // splash on top of you: no direction
    const a = Math.atan2(right, fwd) - Math.PI / 2;     // 0 = straight ahead = top of screen
    ctx.strokeStyle = `rgba(255,30,30,${0.85 * (1 - (now - d.t0) / DAMAGE_DIR_MS)})`;
    ctx.beginPath();
    ctx.arc(SCREEN_W / 2, HALF_H, 120, a - 0.35, a + 0.35);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

// Red wash when hurt, white when the keyboard fires, green when picking something up
function drawScreenFlash() {
  if (game.hurt > 0) {
    // Vignette: heavier at the edges so the center stays readable
    const grad = ctx.createRadialGradient(SCREEN_W / 2, HALF_H, 80, SCREEN_W / 2, HALF_H, 460);
    grad.addColorStop(0, `rgba(200,0,0,${game.hurt * 0.25})`);
    grad.addColorStop(1, `rgba(200,0,0,${game.hurt * 0.65})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  }
  if (game.fireFlash > 0) {
    ctx.fillStyle = `rgba(255,245,210,${game.fireFlash * 0.12})`;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  }
  if (game.pickup > 0) {
    ctx.fillStyle = `rgba(60,220,90,${game.pickup * 0.18})`;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  }
  if (game.cyanFlash > 0) {
    ctx.fillStyle = `rgba(90,230,255,${game.cyanFlash * 0.45})`;
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  }
}

// Boss health bar (top center): name, phase, stun state; flickers "TTL 0" in phase 3
function drawBossBar() {
  const b = game.boss;
  if (!b || b.state === 'dead') return;
  const now = performance.now();
  const W = 340, X = (SCREEN_W - W) / 2, Y = 10;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(X - 6, Y - 4, W + 12, 30);
  ctx.fillStyle = '#1a0a1a';
  ctx.fillRect(X, Y + 12, W, 9);
  ctx.fillStyle = b.phase === 3 ? ((now / 120 | 0) % 2 ? '#ff2050' : '#a01040') : b.phase === 2 ? '#d0306a' : '#9a40ff';
  ctx.fillRect(X, Y + 12, W * Math.max(0, b.hp / b.def.hp), 9);
  // Phase thresholds
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(X + W * 0.5, Y + 12, 1, 9);
  ctx.fillRect(X + W * 0.25, Y + 12, 1, 9);
  ctx.font = 'bold 10px monospace';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#e8d8ff';
  ctx.fillText('THE DNS', X, Y + 4);
  ctx.textAlign = 'right';
  const stunned = now < b.stunnedUntil;
  ctx.fillStyle = stunned ? '#5ae6ff' : b.phase === 3 ? '#ff4060' : '#a090c0';
  ctx.fillText(stunned ? 'CACHE FLUSHED' : `PHASE ${b.phase}  ${BOSS_PHASES[b.phase].name}`, X + W, Y + 4);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawServfail() {
  const jx = (Math.random() - 0.5) * 6, jy = (Math.random() - 0.5) * 6;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 64px monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText('SERVFAIL', SCREEN_W / 2 + 4 + jx, HALF_H - 40 + 4 + jy);
  ctx.fillStyle = '#ff3050';
  ctx.fillText('SERVFAIL', SCREEN_W / 2 + jx, HALF_H - 40 + jy);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function fmtTime(ms) {
  const s = Math.max(0, ms / 1000 | 0);
  return `${s / 60 | 0}:${String(s % 60).padStart(2, '0')}`;
}

// --- Victory screen: a terminal finally resolves, then the banner and stats ---
// Commands are typed out (typed = 1); their output appears at once
const VICTORY_TERM = [
  ['C:\\> ipconfig /flushdns', 1],
  ['Successfully flushed the DNS Resolver Cache.', 0],
  ['C:\\> nslookup intranet.corp', 1],
  ['Server:   dns01.corp', 0],
  ['Address:  10.0.0.53', 0],
  ['Name:     intranet.corp', 0],
  ['Address:  10.0.4.20', 0],
  ['C:\\> ping -n 1 intranet.corp', 1],
  ['Reply from 10.0.4.20: bytes=32 time<1ms TTL=128', 0],
];
const VICTORY_FADE_MS = 700;
const VICTORY_CPS     = 40; // typing speed
let victoryT = VICTORY_FADE_MS;
const VICTORY_SCHED = VICTORY_TERM.map(([text, typed]) => {
  const s = { text, typed, at: victoryT, dur: typed ? text.length * 1000 / VICTORY_CPS : 0 };
  victoryT += s.dur + (typed ? 250 : 110);
  return s;
});
const VICTORY_BANNER_AT = victoryT + 300; // ms after the win

// Characters shown of line s at time t (ms since the win)
function victoryLineChars(s, t) {
  if (t < s.at) return 0;
  return s.typed ? Math.min(s.text.length, Math.floor((t - s.at) / s.dur * s.text.length)) : s.text.length;
}
function victoryTyped(t) {
  return VICTORY_SCHED.reduce((n, s) => n + (s.typed ? victoryLineChars(s, t) : 0), 0);
}

function victoryRank() {
  const mins = (game.endAt - game.startAt) / 60000;
  const score = game.health + Math.max(0, 12 - mins) * 8;
  return score >= 150 ? 'NETWORK ARCHITECT' : score >= 100 ? 'SENIOR SYSADMIN' : score >= 60 ? 'TIER 2 SUPPORT' : 'HELPDESK INTERN';
}

function drawVictoryOverlay() {
  const now = performance.now(), t = now - game.wonAt, cx = SCREEN_W / 2;
  ctx.fillStyle = `rgba(0,8,4,${Math.min(0.94, t / VICTORY_FADE_MS * 0.94)})`;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = '13px monospace';
  const X = 170, Y = 52;
  let cursor = null;
  VICTORY_SCHED.forEach((s, i) => {
    const n = victoryLineChars(s, t);
    if (!n) return;
    ctx.fillStyle = s.typed ? '#e8e8e8' : '#3dff73';
    ctx.fillText(s.text.slice(0, n), X, Y + i * 18);
    if (s.typed) cursor = [X + ctx.measureText(s.text.slice(0, n)).width + 2, Y + i * 18];
  });
  if (cursor && t < VICTORY_BANNER_AT && (now / 400 | 0) % 2) {
    ctx.fillStyle = '#e8e8e8';
    ctx.fillRect(cursor[0], cursor[1] - 7, 8, 14);
  }

  ctx.textAlign = 'center';
  if (t >= VICTORY_BANNER_AT) {
    const k = Math.min(1, (t - VICTORY_BANNER_AT) / 250);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.shadowColor = '#3dff73';
    ctx.shadowBlur = 18;
    ctx.font = 'bold 34px monospace';
    ctx.fillStyle = '#3dff73';
    ctx.fillText('CONNECTION ESTABLISHED.', cx, 246);
    ctx.restore();
  }
  if (t >= VICTORY_BANNER_AT + 700) {
    const rows = [
      ['TICKETS CLOSED',  `${game.kills}`],
      ['TIME TO RESOLVE', fmtTime(game.endAt - game.startAt)],
      ['SLA REMAINING',   `${game.health}%`],
      ['RANK',            victoryRank()],
    ];
    ctx.font = 'bold 12px monospace';
    rows.forEach(([k, v], i) => {
      const y = 292 + i * 22;
      ctx.textAlign = 'right';
      ctx.fillStyle = '#6a8a72';
      ctx.fillText(k, cx - 12, y);
      ctx.textAlign = 'left';
      ctx.fillStyle = i === 3 ? '#ffe9a8' : '#e8e8e8';
      ctx.fillText(v, cx + 12, y);
    });
  }
  if (t >= VICTORY_BANNER_AT + 1400) {
    ctx.textAlign = 'center';
    ctx.font = 'italic 13px monospace';
    ctx.fillStyle = '#a090c0';
    ctx.fillText("It was DNS. It's always DNS.", cx, 398);
    if ((now / 500 | 0) % 2 === 0) {
      ctx.font = 'bold 13px monospace';
      ctx.fillStyle = '#ccc';
      ctx.fillText('PRESS  R  TO PLAY AGAIN', cx, 436);
    }
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawHUD() {
  const w = WEAPONS[game.weapon];

  // Bottom bar background
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, SCREEN_H - 36, SCREEN_W, 36);
  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(0, SCREEN_H - 37, SCREEN_W, 1);

  ctx.textBaseline = 'middle';
  const midY = SCREEN_H - 18;

  // SLA / Health
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = '#666';
  ctx.textAlign = 'left';
  ctx.fillText('SLA', 14, midY);

  const hp = game.health / game.maxHealth;
  const barW = 140;
  const hpColor = hp > 0.5 ? '#22cc55' : hp > 0.25 ? '#ccaa00' : '#cc2200';
  ctx.fillStyle = '#111';
  ctx.fillRect(44, midY - 8, barW, 16);
  ctx.fillStyle = hpColor;
  ctx.fillRect(44, midY - 8, barW * hp, 16);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.strokeRect(44, midY - 8, barW, 16);
  ctx.fillStyle = '#ccc';
  ctx.font = 'bold 10px monospace';
  ctx.fillText(`${game.health}%`, 192, midY);

  // Divider
  ctx.fillStyle = '#333';
  ctx.fillRect(250, SCREEN_H - 34, 1, 32);

  // Weapon slots: key, name, ammo. Active = green frame; empty = red; not picked up yet = dark
  const now = performance.now();
  const blink = (now / 250 | 0) % 2 === 0;
  ['keyboard', 'cannon'].forEach((name, i) => {
    const W = WEAPONS[name], owned = name === 'keyboard' || game.hasCannon;
    const n = game[W.ammo], active = name === game.weapon, empty = owned && n <= 0;
    const sx = 262 + i * 142, sy = SCREEN_H - 31, sw = 134, sh = 26;
    ctx.fillStyle = active ? 'rgba(30,90,45,0.55)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(sx, sy, sw, sh);
    ctx.strokeStyle = !owned ? '#222' : active ? (empty && blink ? '#ff3030' : '#3dff73') : empty ? '#502020' : '#444';
    ctx.lineWidth = active ? 2 : 1;
    ctx.strokeRect(sx + 0.5, sy + 0.5, sw - 1, sh - 1);
    // Key badge
    ctx.fillStyle = !owned ? '#1a1a1a' : active ? '#3dff73' : '#333';
    ctx.fillRect(sx + 5, sy + 6, 14, 14);
    ctx.fillStyle = !owned ? '#333' : active ? '#000' : '#aaa';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${W.key}`, sx + 12, sy + 13);
    // Name and ammo
    ctx.textAlign = 'left';
    ctx.fillStyle = !owned ? '#333' : empty ? '#a03030' : active ? '#e8e8e8' : '#888';
    ctx.fillText(owned ? W.slot : '- - -', sx + 25, sy + 13);
    ctx.textAlign = 'right';
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = !owned ? '#333' : empty ? '#ff3030' : active ? '#3dff73' : '#888';
    ctx.fillText(owned ? `${n}` : '--', sx + sw - 6, sy + 13);
  });

  // Divider
  ctx.fillStyle = '#333';
  ctx.fillRect(SCREEN_W - 250, SCREEN_H - 34, 1, 32);

  // Ammo for the current weapon (pulses red when empty)
  const ammo = game[w.ammo], max = game[w.max];
  ctx.fillStyle = ammo <= 0 ? (blink ? '#ff3030' : '#601010') : '#666';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(w.ammoLabel, SCREEN_W - 90, midY);

  const ammoColor = ammo <= 0 ? (blink ? '#ff3030' : '#601010') : ammo > max * 0.4 ? '#22cc55' : ammo > max * 0.16 ? '#ccaa00' : '#cc2200';
  ctx.fillStyle = ammoColor;
  ctx.font = 'bold 18px monospace';
  ctx.fillText(`${ammo}`, SCREEN_W - 40, midY + 1);
  ctx.fillStyle = '#444';
  ctx.font = '10px monospace';
  ctx.fillText(`/${max}`, SCREEN_W - 16, midY + 4);

  // Kill counter (top right)
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(SCREEN_W - 150, 8, 142, 20);
  ctx.fillStyle = '#666';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('TICKETS CLOSED', SCREEN_W - 40, 18);
  ctx.fillStyle = '#22cc55';
  ctx.font = 'bold 12px monospace';
  ctx.fillText(`${game.kills}`, SCREEN_W - 14, 18);

  // Flush DNS Cache charges (just above the bar, bottom left)
  if (game.flushes > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(10, SCREEN_H - 62, 150, 20);
    ctx.fillStyle = '#5ae6ff';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(`[F] FLUSH DNS CACHE ×${game.flushes}`, 16, SCREEN_H - 52);
  }

  // Pickup / event message (top center) and use prompt
  ctx.textAlign = 'center';
  if (performance.now() < game.msgUntil) {
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(SCREEN_W / 2 - ctx.measureText(game.msg).width / 2 - 10, 38, ctx.measureText(game.msg).width + 20, 22);
    ctx.fillStyle = '#e8e8e8';
    ctx.fillText(game.msg, SCREEN_W / 2, 49);
  }
  if (game.usePrompt && !game.over) {
    ctx.font = 'bold 12px monospace';
    if (game.usePrompt.type === SWITCH) {
      ctx.fillStyle = game.switchOn ? '#30ff60' : '#e8e8e8';
      ctx.fillText(game.switchOn ? 'MAIN SWITCH RESET' : '[ E ]  RESET MAIN SWITCH', SCREEN_W / 2, HALF_H + 50);
    } else {
      const type = game.usePrompt.type, locked = doorLocked(type);
      const lockedText = type === SECURITY_DOOR ? 'ACQUIRE CLOSING CANNON TO PROCEED'
                       : game.bossTriggered ? 'LOCKED' : 'RESET THE MAIN SWITCH TO UNLOCK'; // re-sealed once the fight starts
      ctx.fillStyle = locked ? '#ff5050' : '#e8e8e8';
      ctx.fillText(locked ? lockedText : '[ E ]  OPEN', SCREEN_W / 2, HALF_H + 50);
    }
  }

  // Out-of-ammo alert: flashes hard at first, then holds steady until it fades
  const ea = now - game.emptyAt;
  if (game.emptyAt && ea < EMPTY_ALERT_MS && (ea > 600 || blink)) {
    ctx.font = 'bold 16px monospace';
    const tw = ctx.measureText(game.emptyMsg).width;
    ctx.globalAlpha = Math.min(1, (EMPTY_ALERT_MS - ea) / 300);
    ctx.fillStyle = 'rgba(40,0,0,0.75)';
    ctx.fillRect(SCREEN_W / 2 - tw / 2 - 14, HALF_H + 66, tw + 28, 28);
    ctx.strokeStyle = '#ff3030';
    ctx.lineWidth = 1;
    ctx.strokeRect(SCREEN_W / 2 - tw / 2 - 13.5, HALF_H + 66.5, tw + 27, 27);
    ctx.fillStyle = '#ff4040';
    ctx.fillText(game.emptyMsg, SCREEN_W / 2, HALF_H + 80);
    ctx.globalAlpha = 1;
  }

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawMinimap() {
  const S = 5, OX = 10, OY = 10;
  ctx.globalAlpha = 0.65;
  for (let r = 0; r < MAP_H; r++) {
    for (let c = 0; c < MAP_W; c++) {
      ctx.fillStyle = MAP[r][c] === SWITCH && game.switchOn ? '#30ff60' : MAP[r][c] > 0 ? MINIMAP_COLORS[MAP[r][c]] : '#111';
      ctx.fillRect(OX + c * S, OY + r * S, S - 1, S - 1);
    }
  }
  // Enemies (bright = alerted, dim = idle, dark = dead), projectiles
  for (const e of enemies) {
    if (e.type === 'dns') { ctx.fillStyle = e.state === 'dead' ? '#424' : '#e040ff'; ctx.fillRect(OX + e.x * S - 3, OY + e.y * S - 3, 6, 6); continue; }
    ctx.fillStyle = e.state === 'dead' ? '#511' : e.state === 'idle' ? '#a33' : '#f44';
    ctx.fillRect(OX + e.x * S - 2, OY + e.y * S - 2, 3, 3);
  }
  for (const p of projectiles) {
    ctx.fillStyle = p.kind === 'rocket' ? '#ff8030' : p.kind === 'nx' ? '#ff3050' : '#ff4fa0';
    ctx.fillRect(OX + p.x * S - 1, OY + p.y * S - 1, 2, 2);
  }
  // Player dot + direction line
  const px = OX + player.x * S, py = OY + player.y * S;
  ctx.fillStyle = '#0f0';
  ctx.fillRect(px - 2, py - 2, 4, 4);
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.lineTo(px + player.dirX * 8, py + player.dirY * 8);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// --- Death screen: your own helpdesk ticket, stamped CLOSED ---
const STAMP_AT = 1300; // ms after death when the stamp lands (R works after this)
const DEATH_CAUSES = {
  printer: 'PRINTER  (PC LOAD LETTER)',
  router:  'ROGUE ROUTER  (PACKET STORM)',
  shadow:  'SHADOW IT  (UNAPPROVED SOFTWARE)',
  dns:     'THE DNS  (NXDOMAIN)',
  self:    'YOUR OWN CLOSING CANNON',
};
const RESOLUTIONS = [
  'Closed — user unresponsive.',
  'Closed — could not reproduce.',
  'Closed — working as intended.',
  'Closed — tried turning it off and on.',
  'Closed — duplicate of known issue.',
];

function drawDeathOverlay() {
  const now = performance.now(), t = now - game.overAt, cx = SCREEN_W / 2;
  ctx.fillStyle = `rgba(40,0,0,${0.35 + Math.min(1, t / 900) * 0.4})`;
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  if (t < 500) return;
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = Math.min(1, (t - 500) / 300);
  ctx.textAlign = 'center';
  ctx.font = 'bold 26px monospace';
  ctx.fillStyle = '#ff4040';
  ctx.fillText("YOU'VE BEEN CLOSED.", cx, 88);

  // The ticket
  const W = 500, H = 206, X = cx - W / 2, Y = 124;
  ctx.fillStyle = 'rgba(16,8,8,0.94)';
  ctx.fillRect(X, Y, W, H);
  ctx.fillStyle = '#3a1010';
  ctx.fillRect(X, Y, W, 26);
  ctx.strokeStyle = '#6a2020';
  ctx.lineWidth = 2;
  ctx.strokeRect(X, Y, W, H);
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffb0b0';
  ctx.fillText(`HELPDESK TICKET  #INC${game.ticketNo}`, X + 12, Y + 13);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff5050';
  ctx.fillText('PRIORITY: P1', X + W - 12, Y + 13);
  const rows = [
    ['SUBJECT',        'Technician not responding'],
    ['ASSIGNED TO',    'You'],
    ['CAUSE',          DEATH_CAUSES[game.killedBy] || 'UNKNOWN'],
    ['TICKETS CLOSED', `${game.kills}`],
    ['TIME ON SHIFT',  fmtTime(game.endAt - game.startAt)],
    ['RESOLUTION',     game.resolution],
  ];
  ctx.font = '12px monospace';
  ctx.textAlign = 'left';
  rows.forEach(([k, v], i) => {
    if (t < 700 + i * 110) return; // fields fill in one by one
    const y = Y + 46 + i * 26;
    ctx.fillStyle = '#8a6060';
    ctx.fillText(k, X + 16, y);
    ctx.fillStyle = '#e8d0d0';
    ctx.fillText(v, X + 150, y);
  });
  ctx.globalAlpha = 1;

  // CLOSED stamp slams down
  if (t >= STAMP_AT) {
    const k = Math.min(1, (t - STAMP_AT) / 120), s = 2.6 - 1.6 * k;
    ctx.save();
    ctx.translate(X + W - 104, Y + H - 58);
    ctx.rotate(-0.22);
    ctx.scale(s, s);
    ctx.globalAlpha = 0.3 + 0.6 * k;
    ctx.strokeStyle = '#ff2a2a';
    ctx.lineWidth = 4;
    ctx.strokeRect(-76, -24, 152, 48);
    ctx.fillStyle = '#ff2a2a';
    ctx.font = 'bold 34px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('CLOSED', 0, 2);
    ctx.restore();
  }
  if (t >= STAMP_AT + 400 && (now / 500 | 0) % 2 === 0) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = '#ccc';
    ctx.fillText('PRESS  R  TO REOPEN', cx, Y + H + 40);
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// --- Loop ---
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
// R from the death/victory screen reloads straight into the game
try { if (sessionStorage.getItem('dnsSkipTitle')) { sessionStorage.removeItem('dnsSkipTitle'); startGame(true); } } catch (e) {}
loop();
</script>
